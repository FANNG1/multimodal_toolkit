# 轻量、单副本 Prometheus：只保存本地 Ray 集群的指标，避免本地开发机负担过重。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: daft-ray
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: daft-audio-pushgateway
        static_configs:
          - targets: [pushgateway:9091]
      - job_name: ray
        kubernetes_sd_configs:
          # Pod discovery 配合 Ray 节点标签，避免 Endpoints 元数据在不同
          # Prometheus/Kubernetes 版本间的端口标签差异。
          - role: pod
            namespaces:
              names: [daft-ray]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_ray_io_is_ray_node]
            action: keep
            # KubeRay 将 ray.io/is-ray-node 标签的值设为 "yes"。
            regex: "yes"
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
---
 # Prometheus 通过 Kubernetes 服务发现读取 Service、Endpoints 和 Pod；默认账号没有
 # 这些读取权限，会导致 UI 中没有任何 active target。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: daft-ray
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: daft-ray
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: daft-ray
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: daft-ray
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: daft-ray
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: daft-ray
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
