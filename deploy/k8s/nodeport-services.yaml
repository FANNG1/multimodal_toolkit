# 本地开发访问入口：通过 Minikube 节点地址暴露 Ray Dashboard 和 Grafana。
# 这里单独创建 Service，避免修改 KubeRay 管理的 head Service；NodePort 仅适合
# 本地环境，且 Dashboard/Grafana 的访问权限不能视为生产级安全边界。
apiVersion: v1
kind: Service
metadata:
  name: ray-dashboard-nodeport
  namespace: daft-ray
  labels:
    app.kubernetes.io/name: ray-dashboard
spec:
  type: NodePort
  selector:
    app.kubernetes.io/created-by: kuberay-operator
    app.kubernetes.io/name: kuberay
    ray.io/cluster: daft-ray
    ray.io/identifier: daft-ray-head
    ray.io/node-type: head
  ports:
    - name: dashboard
      port: 8265
      targetPort: dashboard
      nodePort: 30265
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: daft-ray
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
      nodePort: 30300
      protocol: TCP
