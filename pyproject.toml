[project]
name = "multimodal-toolkit"
version = "0.1.0"
description = "Minimal audio POC: S3 manifest -> Lance blob v2 -> analysis -> acoustic embedding -> query"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "daft-lance>=0.4.0",
  "funasr",
  "getdaft",
  "httpx",
  "insightface",
  "lance-ray==0.5.0",
  "modelscope",
  "numpy",
  "onnxruntime",
  "opencv-python-headless",
  "openai",
  "pillow",
  "psutil",
  "pyarrow",
  "pylance==9.0.0",
  "python-dotenv",
  "ray",
  "soundfile",
  "torch",
  "torchaudio",
  "transformers",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
  "ray: hard dependency on a local Ray cluster; excluded by default, run with `pytest -m ray`",
  "benchmark_e2e: real MinIO + local Ray + SenseVoice benchmark; excluded by default",
]
addopts = "-m 'not ray and not benchmark_e2e'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multimodal_toolkit"]
